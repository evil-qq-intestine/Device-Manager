spring:
  application:
    name: device-manager

  datasource:
    url: jdbc:sqlite:./data.db
    driver-class-name: org.sqlite.JDBC
    # SQLite 不需要用户名密码，保留空值即可
    username:
    password:
    hikari:
      # SQLite 是单文件、写操作串行，固定单连接最稳，也最省内存
      pool-name: sqlite-pool
      maximum-pool-size: 1
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 0
      max-lifetime: 0
      connection-init-sql: "PRAGMA busy_timeout=5000"

  jpa:
    hibernate:
      ddl-auto: update            # 自动更新表结构（推荐开发环境使用）
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    show-sql: ${JPA_SHOW_SQL:false}   # 仅打印 SQL 文本（? 占位符，不含绑定值）；排查时设 JPA_SHOW_SQL=true
    properties:
      hibernate:
              enhance:
                enableLazyInitialization: true

  docker:
    compose:
      enabled: false

jwt:
  # 生产环境务必用环境变量 JWT_SECRET 覆盖（openssl rand -base64 48）；保留占位值可被伪造 token
  secret: your-256-bit-secret-key-here-at-least-32-characters #密钥
  expiration: 86400000 # Token有效期24小时

wol:
  ipv6:
    multicast-address: ff02::1
    networkCard: wlp1s0
  ipv4:
    broadcast-address: "255.255.255.255"
  port: 9

ping:
  task-time: 10

app:
  # 构建时由 Maven 资源过滤注入（@project.version@）
  version: "@project.version@"
  security:
    jwt:
      # true = 检测到占位/弱 JWT 密钥时拒绝启动；false = 仅告警
      fail-on-insecure-secret: ${JWT_FAIL_ON_INSECURE:true}
  update:
    github-repo: evil-qq-intestine/Device-Manager  # 版本检测来源（GitHub Releases）
    check-interval-ms: 21600000                    # 定时检测间隔，默认 6 小时
    initial-delay-ms: 15000                        # 启动后首次检测延迟
    docker-image: ghcr.io/evil-qq-intestine/device-manager
    asset-prefix: device-manager                   # Release 产物前缀（<prefix>-linux-amd64 等）
  server-url: http://10.34.70.66:8080
  script:
    # 未设置环境变量 APP_MASTER_KEY 时，读取/自动生成该本地密钥文件
    master-key-file: ./.master-key
    scan-interval-ms: 60000          # 定时扫描 ONCE / CRON 的间隔
    on-boot-cooldown-seconds: 300    # ON_BOOT 同一任务冷却时间
    ssh:
      connect-timeout-ms: 10000      # SSH 连接/认证超时
      command-timeout-ms: 120000     # 远程命令执行超时
      output-charset: AUTO           # 远程输出解码：AUTO / UTF-8 / GBK / GB18030 / windows-1252