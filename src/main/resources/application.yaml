spring:
  application:
    name: tool

  datasource:
    url: jdbc:sqlite:./data.db
    driver-class-name: org.sqlite.JDBC
    # SQLite 不需要用户名密码，保留空值即可
    username:
    password:

  jpa:
    hibernate:
      ddl-auto: update            # 自动更新表结构（推荐开发环境使用）
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    show-sql: true
    properties:
      hibernate:
              enhance:
                enableLazyInitialization: true                # 打印 SQL，方便调试

  docker:
    compose:
      enabled: false

jwt:
  secret: your-256-bit-secret-key-here-at-least-32-characters #密钥
  expiration: 86400000 # Token有效期24小时

wol:
  ipv6:
    multicast-address: ff02::1
    networkCard: wlp1s0
  ipv4:
    broadcast-address: "255.255.255.255"
  port: 9

ping:
  task-time: 10

app:
  server-url: http://10.34.70.66:8080
  script:
    # 未设置环境变量 APP_MASTER_KEY 时，读取/自动生成该本地密钥文件
    master-key-file: ./.master-key
    scan-interval-ms: 60000          # 定时扫描 ONCE / CRON 的间隔
    on-boot-cooldown-seconds: 300    # ON_BOOT 同一任务冷却时间
    ssh:
      connect-timeout-ms: 10000      # SSH 连接/认证超时
      command-timeout-ms: 120000     # 远程命令执行超时