spring:
  application:
    name: device-manager

  datasource:
    url: jdbc:sqlite:./data.db
    driver-class-name: org.sqlite.JDBC
    # SQLite 不需要用户名密码，保留空值即可
    username:
    password:
    hikari:
      # SQLite 是单文件、写操作串行，固定单连接最稳，也最省内存
      pool-name: sqlite-pool
      maximum-pool-size: 1
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 0
      max-lifetime: 0
      connection-init-sql: "PRAGMA busy_timeout=5000"

  jpa:
    hibernate:
      ddl-auto: update            # 自动更新表结构（推荐开发环境使用）
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    show-sql: ${JPA_SHOW_SQL:false}   # 仅打印 SQL 文本（? 占位符，不含绑定值）；排查时设 JPA_SHOW_SQL=true
    properties:
      hibernate:
              enhance:
                enableLazyInitialization: true

server:
  # 反向代理（nginx）与 Docker 端口映射下，让 getScheme()/getServerName()/getServerPort()
  # 认 X-Forwarded-Proto / X-Forwarded-Host / X-Forwarded-Port。
  # 必须是 framework（= ForwardedHeaderFilter，信任任何来源的转发头）；
  # NATIVE（Tomcat RemoteIpValve）只信任 internalProxies 匹配的来源，
  # Docker 网桥下代理 IP 常常不匹配 → 转发头被丢弃 → 心跳脚本里写进容器内网地址。
  forward-headers-strategy: framework

jwt:
  # 生产环境务必用环境变量 JWT_SECRET 覆盖（openssl rand -base64 48）；保留占位值可被伪造 token
  secret: your-256-bit-secret-key-here-at-least-32-characters123 #密钥
  expiration: 86400000 # Token有效期24小时

wol:
  ipv6:
    multicast-address: ff02::1
    # 组播模式使用的网卡列表，留空 = 自动探测（推荐）。
    # 属性名是 network-cards，对应 WolIpv6Properties.networkCards。
    # 旧配置写的是单数 networkCard: wlp1s0 —— 绑不上任何字段（一直是死配置），
    # 而且 wlp1s0 只在那台机器上存在，写死会直接顶掉自动探测。
    # network-cards:
    #   - eth0
  ipv4:
    # 兜底全局广播。真正生效的是 DeviceIpv4Checker 现场枚举出的各网卡广播地址；
    # 本服务若跑在 Docker bridge 网络里，广播出不了容器，需要 --network host
    # 或直接在宿主机部署，否则局域网设备收不到魔术包（启动日志会提示）。
    broadcast-address: "255.255.255.255"
  # 魔术包目标端口，可写多个。属性名是复数 ports，对应 MagicPacketComponent 的 int[]。
  # 旧配置写的是单数 wol.port —— 绑不上，一直用的默认值 9。
  ports: [9]

ping:
  task-time: 10

app:
  # 构建时由 Maven 资源过滤注入（@project.version@）
  version: "@project.version@"
  security:
    jwt:
      # true = 检测到占位/弱 JWT 密钥时拒绝启动；false = 仅告警
      fail-on-insecure-secret: ${JWT_FAIL_ON_INSECURE:true}
  update:
    github-repo: evil-qq-intestine/Device-Manager  # 版本检测来源（GitHub Releases）
    check-interval-ms: 21600000                    # 定时检测间隔，默认 6 小时
    initial-delay-ms: 15000                    # 启动后首次检测延迟
    asset-prefix: device-manager                   # Release 产物文件名前缀（<prefix>.jar）
  # 心跳脚本里写什么服务端地址：默认留空 = 按下载脚本那次 HTTP 请求现场推导
  # （Host + X-Forwarded-*，见上面的 forward-headers-strategy）。
  # 只有在「管理员从 localhost 打开页面、但设备要走公网地址」这类场景才需要显式覆盖。
  server-url:
  script:
    # 未设置环境变量 APP_MASTER_KEY 时，读取/自动生成该本地密钥文件
    master-key-file: ./.master-key
    scan-interval-ms: 10000          # 定时扫描 ONCE / CRON 的间隔（含提前唤醒）
    on-boot-cooldown-seconds: 300    # ON_BOOT 同一任务冷却时间
    ssh:
      connect-timeout-ms: 10000      # SSH 连接/认证超时
      command-timeout-ms: 120000     # 远程命令执行超时
      output-charset: AUTO           # 远程输出解码：AUTO / UTF-8 / GBK / GB18030 / windows-1252