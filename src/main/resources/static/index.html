<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>设备管家 · Device Manager</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <script>
        (function () {
            try {
                var t = localStorage.getItem("devicemanager.theme") ||
                    (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
                if (t === "dark") document.documentElement.classList.add("dark");
            } catch (e) { /* ignore */ }
        })();
    </script>
    <link rel="stylesheet" href="/vendor/element-plus/index.css">
    <link rel="stylesheet" href="/vendor/element-plus/theme-chalk/dark/css-vars.css">
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <div class="backdrop" aria-hidden="true">
        <span class="backdrop__bloom backdrop__bloom--blue"></span>
        <span class="backdrop__bloom backdrop__bloom--purple"></span>
        <span class="backdrop__bloom backdrop__bloom--teal"></span>
    </div>

    <div id="app"></div>

    <script src="/vendor/vue/vue.global.prod.js"></script>
    <script src="/vendor/element-plus/index.full.min.js"></script>
    <script src="/vendor/element-plus/icons/index.iife.min.js"></script>
    <script src="/vendor/echarts/echarts.min.js"></script>
    <script src="/vendor/dayjs/dayjs.min.js"></script>
    <script src="/script-task.js"></script>
    <script src="/script-check.js"></script>
    <script src="/app.js"></script>
</body>
</html>
