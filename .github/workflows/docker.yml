name: Build & Publish Docker images

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # Docker Hub 镜像名（全小写，无 registry 前缀）。
  # 优先取仓库变量 DOCKERHUB_IMAGE，未设置时回退到下面的默认值；
  # fork 后可在 Settings → Variables 里改成自己的命名空间。
  DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE || 'emmmm666/device-manager' }}

# 说明：自 1.0.4 起不再维护 GraalVM native 二进制镜像（编译坑太多），
# 只构建 JVM 多架构镜像；tag 推送时额外构建可执行 jar 并创建 GitHub Release
# （版本检测与「直接更新」依赖 Release 产物）。
jobs:
  # ============================================================
  # JVM 镜像（多架构：amd64 + arm64，默认标签）
  # jar 跨平台，构建阶段固定跑在构建机架构，只有打包按目标架构
  # 同时推送到 GHCR 与 Docker Hub
  # ============================================================
  jvm:
    name: JVM image (multi-arch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Compute lowercase image name
        id: img
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ steps.img.outputs.name }}
            ${{ env.DOCKERHUB_IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=jvm
          cache-to: type=gha,mode=max,scope=jvm

  # ============================================================
  # tag 推送时额外构建可执行 jar，作为「直接更新」的产物
  # ============================================================
  jar:
    name: Build runnable JAR
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Package
        run: |
          chmod +x mvnw
          ./mvnw -B -DskipTests package

      - name: Rename jar
        run: cp target/device-manager-*.jar device-manager.jar

      - uses: actions/upload-artifact@v4
        with:
          name: release-jar
          path: device-manager.jar
          if-no-files-found: error
          retention-days: 7

  # ============================================================
  # tag 推送时创建 GitHub Release，并附上可执行 jar
  # 版本检测（GitHub Releases API）与「直接更新」都依赖该产物
  # ============================================================
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [ jar ]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: release-*
          merge-multiple: true

      - name: List assets
        run: ls -lh release-assets

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            release-assets/*
