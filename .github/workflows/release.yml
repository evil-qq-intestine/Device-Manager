name: Build & Publish Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  # ============================================================
  # tag 推送时构建可执行 jar，作为「直接更新」的产物
  # ============================================================
  jar:
    name: Build runnable JAR
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Package
        run: |
          chmod +x mvnw
          ./mvnw -B -DskipTests package

      - name: Rename jar
        run: cp target/device-manager-*.jar device-manager.jar

      - uses: actions/upload-artifact@v4
        with:
          name: release-jar
          path: device-manager.jar
          if-no-files-found: error
          retention-days: 7

  # ============================================================
  # tag 推送时创建 GitHub Release，并附上可执行 jar
  # 版本检测（GitHub Releases API）与「直接更新」都依赖该产物
  # ============================================================
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [ jar ]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: release-*
          merge-multiple: true

      - name: List assets
        run: ls -lh release-assets

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            release-assets/*
